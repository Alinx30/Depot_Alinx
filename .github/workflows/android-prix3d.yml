name: Android – Prix Impression 3D

on:
  push:
    paths:
      - "prix-impression-3d/**"
      - ".github/workflows/android-prix3d.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prix-impression-3d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Construction de l'APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk Prix-Impression-3D.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Prix-Impression-3D-apk
          path: prix-impression-3d/Prix-Impression-3D.apk

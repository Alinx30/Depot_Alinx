<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fioles Enchantées</title>
<style>
  :root {
    --bg1: #1b1033;
    --bg2: #3a1d5c;
    --glass: rgba(255,255,255,0.10);
    --glass-edge: rgba(255,255,255,0.55);
    --text: #f6eefe;
    --accent: #ffcf5c;
    --btn: rgba(255,255,255,0.12);
    --tube-w: 54px;
    --seg-h: 40px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Trebuchet MS", system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg1) 70%);
    background-color: var(--bg1);
    display: flex; flex-direction: column; align-items: center;
    overflow-x: hidden; user-select: none;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; opacity: .6;
    animation: twinkle 3s infinite ease-in-out; }
  @keyframes twinkle { 50% { opacity: .1; } }

  header { position: relative; z-index: 1; width: 100%; max-width: 720px; padding: 16px 16px 4px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { margin: 0; font-size: 1.35rem; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .level { font-size: 1rem; opacity: .85; }
  .moves { font-size: .85rem; opacity: .6; text-align: center; position: relative; z-index: 1; min-height: 1.2em; }

  #board { position: relative; z-index: 1; flex: 1; width: 100%; max-width: 720px; padding: 24px 16px;
    display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 34px 18px; }

  .tube { position: relative; width: var(--tube-w); height: calc(var(--seg-h) * 4 + 22px);
    cursor: pointer; transition: transform .25s ease; transform-origin: 50% 0; }
  .tube .glass { position: absolute; inset: 0; border: 3px solid var(--glass-edge); border-top: none;
    border-radius: 0 0 28px 28px; background: var(--glass); overflow: hidden;
    display: flex; flex-direction: column-reverse; padding-bottom: 2px; }
  .tube::before { content: ""; position: absolute; left: -6px; right: -6px; top: -6px; height: 8px;
    border: 3px solid var(--glass-edge); border-radius: 6px; background: rgba(255,255,255,.08); }
  .tube::after { content: ""; position: absolute; top: 14px; left: 8px; width: 6px; bottom: 26px;
    border-radius: 3px; background: rgba(255,255,255,.22); pointer-events: none; }
  .tube.selected { transform: translateY(-22px); }
  .tube.done .glass { box-shadow: 0 0 18px 2px rgba(255,207,92,.55); }
  .tube.shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .seg { height: var(--seg-h); flex: none; position: relative; transition: background-color .2s; }
  .seg:first-child { border-radius: 0 0 24px 24px; }
  .seg .bubble { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.35);
    animation: rise 2.6s infinite ease-in; }
  @keyframes rise { from { transform: translateY(0); opacity: .8; } to { transform: translateY(-30px); opacity: 0; } }
  .seg.top::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: rgba(255,255,255,.25); }

  .stream { position: fixed; width: 6px; border-radius: 3px; z-index: 5; pointer-events: none; }

  footer { position: relative; z-index: 1; display: flex; gap: 12px; padding: 12px 16px 24px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; color: var(--text); background: var(--btn); border: 1px solid rgba(255,255,255,.25);
    border-radius: 14px; padding: 10px 16px; cursor: pointer; min-width: 92px; }
  button:hover:not(:disabled) { background: rgba(255,255,255,.2); }
  button:disabled { opacity: .35; cursor: default; }
  button .count { display: inline-block; margin-left: 6px; background: var(--accent); color: #2a1440;
    border-radius: 10px; padding: 0 7px; font-size: .8rem; font-weight: bold; }

  #win { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    background: rgba(10,4,25,.7); backdrop-filter: blur(3px); }
  #win.show { display: flex; }
  .card { background: linear-gradient(160deg, #4b2a78, #241140); border: 2px solid var(--accent);
    border-radius: 22px; padding: 28px 32px; text-align: center; max-width: 320px; margin: 16px;
    animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .card h2 { margin: 0 0 6px; color: var(--accent); font-size: 1.6rem; }
  .card p { margin: 0 0 18px; opacity: .85; }
  .card button { background: var(--accent); color: #2a1440; font-weight: bold; border: none; }

  @media (max-width: 480px) {
    :root { --tube-w: 42px; --seg-h: 32px; }
    #board { gap: 28px 12px; }
    h1 { font-size: 1.1rem; }
    button { min-width: 0; padding: 9px 12px; }
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<header>
  <h1>✨ Fioles <span>Enchantées</span></h1>
  <div class="level">Niveau <b id="lvl">1</b></div>
</header>
<div class="moves" id="moves"></div>
<main id="board"></main>
<footer>
  <button id="undo">↶ Annuler<span class="count" id="undoCount"></span></button>
  <button id="restart">⟳ Recommencer</button>
  <button id="addTube">＋ Fiole<span class="count" id="addCount"></span></button>
</footer>
<div id="win"><div class="card">
  <h2>Bravo !</h2>
  <p id="winText">Toutes les potions sont triées.</p>
  <button id="next">Niveau suivant →</button>
</div></div>

<script>
(() => {
  const CAP = 4;
  const COLORS = ['#ff4d6d','#4dabff','#5be37d','#ffd23f','#b06bff','#ff8c42',
                  '#2ee6d6','#ff6ec7','#8d6e63','#c7f464','#7d8cff','#e0e0e0'];
  const UNDO_PER_LEVEL = 5, EXTRA_PER_LEVEL = 1;

  const $ = id => document.getElementById(id);
  const board = $('board');

  // ---------- storage (optional) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ---------- seeded RNG ----------
  function rng(seed) {
    let s = seed >>> 0;
    return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // ---------- game rules ----------
  const top = t => t[t.length - 1];
  function topRun(t) { let n = 0; const c = top(t); for (let i = t.length - 1; i >= 0 && t[i] === c; i--) n++; return n; }
  function canPour(a, b) {
    if (!a.length || a === b || b.length >= CAP) return false;
    return !b.length || top(b) === top(a);
  }
  function pour(a, b) {
    const n = Math.min(topRun(a), CAP - b.length);
    for (let i = 0; i < n; i++) b.push(a.pop());
    return n;
  }
  const isDone = t => t.length === CAP && t.every(c => c === t[0]);
  const isWon = ts => ts.every(t => !t.length || isDone(t));

  // ---------- solver (DFS) to guarantee solvable levels ----------
  function solvable(tubes) {
    const seen = new Set();
    const key = ts => ts.map(t => t.join(',')).sort().join('|');
    const stack = [tubes.map(t => t.slice())];
    let steps = 0;
    while (stack.length) {
      const s = stack.pop();
      if (isWon(s)) return true;
      if (++steps > 60000) return false;
      for (let i = 0; i < s.length; i++) {
        if (!s[i].length || isDone(s[i])) continue;
        for (let j = 0; j < s.length; j++) {
          if (i === j || !canPour(s[i], s[j])) continue;
          if (!s[j].length && topRun(s[i]) === s[i].length) continue; // useless move
          const n = s.map(t => t.slice()); pour(n[i], n[j]);
          const k = key(n); if (seen.has(k)) continue;
          seen.add(k); stack.push(n);
        }
      }
    }
    return false;
  }

  function makeLevel(level) {
    const nColors = Math.min(COLORS.length, 3 + Math.floor((level - 1) / 2));
    const empty = 2;
    const r = rng(level * 9973 + 17);
    for (let attempt = 0; attempt < 200; attempt++) {
      const pool = [];
      for (let c = 0; c < nColors; c++) for (let k = 0; k < CAP; k++) pool.push(c);
      for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
      const tubes = [];
      for (let c = 0; c < nColors; c++) tubes.push(pool.slice(c * CAP, c * CAP + CAP));
      for (let e = 0; e < empty; e++) tubes.push([]);
      if (tubes.some(isDone)) continue;
      if (solvable(tubes)) return tubes;
    }
    return null;
  }

  // ---------- state ----------
  let level = store.get('fioles.level', 1);
  let tubes, initial, history, selected, undos, extras, moves, busy;

  function start(lv) {
    level = lv; store.set('fioles.level', level);
    initial = makeLevel(level);
    tubes = initial.map(t => t.slice());
    history = []; selected = -1; moves = 0; busy = false;
    undos = UNDO_PER_LEVEL; extras = EXTRA_PER_LEVEL;
    $('win').classList.remove('show');
    render(true);
  }

  // ---------- rendering ----------
  function render(full) {
    $('lvl').textContent = level;
    $('moves').textContent = moves ? `${moves} coup${moves > 1 ? 's' : ''}` : 'Touchez une fiole pour verser';
    $('undoCount').textContent = undos;
    $('addCount').textContent = extras;
    $('undo').disabled = !history.length || !undos || busy;
    $('addTube').disabled = !extras || busy;

    if (full || board.children.length !== tubes.length) {
      board.innerHTML = '';
      tubes.forEach((_, i) => {
        const el = document.createElement('div');
        el.className = 'tube';
        el.innerHTML = '<div class="glass"></div>';
        el.addEventListener('click', () => onTube(i));
        board.appendChild(el);
      });
    }
    tubes.forEach((t, i) => {
      const el = board.children[i];
      el.classList.toggle('selected', i === selected);
      el.classList.toggle('done', isDone(t));
      const g = el.firstChild;
      g.innerHTML = t.map((c, k) => {
        const bub = k === t.length - 1 ? `<i class="bubble" style="left:${20 + (k * 23 + i * 11) % 50}%;bottom:4px;animation-delay:${((i + k) % 5) * .5}s"></i>` : '';
        return `<div class="seg${k === t.length - 1 ? ' top' : ''}" style="background:${COLORS[c]}">${bub}</div>`;
      }).join('');
    });
  }

  function shake(i) {
    const el = board.children[i];
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  }

  const wait = ms => new Promise(r => setTimeout(r, ms));

  async function animatePour(from, to, color) {
    const a = board.children[from], b = board.children[to];
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const left = rb.left < ra.left;
    const dx = rb.left - ra.left + (left ? rb.width * 0.9 : -rb.width * 0.9);
    const dy = rb.top - ra.top - 60;
    a.style.zIndex = 4;
    a.style.transformOrigin = left ? '0 0' : '100% 0';
    a.style.transform = `translate(${dx}px, ${dy}px) rotate(${left ? -70 : 70}deg)`;
    await wait(260);
    const s = document.createElement('div');
    s.className = 'stream';
    s.style.background = COLORS[color];
    s.style.left = (rb.left + rb.width / 2 - 3) + 'px';
    s.style.top = (rb.top - 34) + 'px';
    s.style.height = (rb.height + 20) + 'px';
    document.body.appendChild(s);
    await wait(240);
    return () => {
      s.remove();
      a.style.transform = ''; a.style.transformOrigin = '';
      setTimeout(() => { a.style.zIndex = ''; }, 250);
    };
  }

  async function onTube(i) {
    if (busy) return;
    if (selected === -1) {
      if (!tubes[i].length || isDone(tubes[i])) { shake(i); return; }
      selected = i; render(); return;
    }
    if (selected === i) { selected = -1; render(); return; }
    const from = selected, to = i;
    if (!canPour(tubes[from], tubes[to])) {
      shake(to);
      if (tubes[i].length && !isDone(tubes[i])) { selected = i; render(); }
      return;
    }
    busy = true;
    board.children[from].classList.remove('selected');
    const finish = await animatePour(from, to, top(tubes[from]));
    history.push(tubes.map(t => t.slice()));
    pour(tubes[from], tubes[to]);
    moves++; selected = -1;
    render();
    finish();
    await wait(260);
    busy = false; render();
    if (isWon(tubes)) setTimeout(win, 300);
  }

  function win() {
    const best = store.get('fioles.best.' + level, null);
    if (best === null || moves < best) store.set('fioles.best.' + level, moves);
    $('winText').textContent = `Niveau ${level} terminé en ${moves} coups` +
      (best !== null && moves >= best ? ` (record : ${best})` : ' — nouveau record !');
    $('win').classList.add('show');
    confetti();
  }

  function confetti() {
    for (let k = 0; k < 40; k++) {
      const d = document.createElement('div');
      d.className = 'stream';
      Object.assign(d.style, { width: '8px', height: '8px', borderRadius: '2px', zIndex: 11,
        background: COLORS[k % COLORS.length], left: Math.random() * innerWidth + 'px', top: '-10px',
        transition: `transform ${1.2 + Math.random()}s ease-in, opacity 1.8s` });
      document.body.appendChild(d);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        d.style.transform = `translate(${(Math.random() - .5) * 200}px, ${innerHeight + 20}px) rotate(${Math.random() * 720}deg)`;
        d.style.opacity = '0.2';
      }));
      setTimeout(() => d.remove(), 2400);
    }
  }

  // ---------- controls ----------
  $('undo').onclick = () => {
    if (!history.length || !undos || busy) return;
    tubes = history.pop(); undos--; moves = Math.max(0, moves - 1); selected = -1;
    render(true);
  };
  $('restart').onclick = () => { if (!busy) start(level); };
  $('addTube').onclick = () => {
    if (!extras || busy) return;
    extras--; history = []; tubes.push([]); selected = -1; render(true);
  };
  $('next').onclick = () => start(level + 1);

  // background stars
  const stars = $('stars');
  for (let k = 0; k < 60; k++) {
    const s = document.createElement('div'); s.className = 'star';
    s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    stars.appendChild(s);
  }

  start(level);
})();
</script>
</body>
</html>
